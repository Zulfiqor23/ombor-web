<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omborchi Tizimi</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --surface: #ffffff;
      --bg: #f8fafc;
      --text: #0f172a;
      --border: #e2e8f0;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .header { font-size: 24px; font-weight: bold; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: 300px 1fr; gap: 20px; }
    .modules-list { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; height: 80vh; overflow-y: auto;}
    .bom-view { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; }
    .module-item { padding: 10px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s; }
    .module-item:hover { background: var(--bg); }
    .module-item strong { display: block; font-size: 16px; }
    .module-item span { color: #64748b; font-size: 13px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 600; font-size: 13px; color: #475569; }
    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      .modules-list { height: 40vh; }
    }
  </style>
</head>
<body>

<div class="header">📦 Omborchi Paneli</div>

<div class="grid">
  <div class="modules-list" id="modules-list">
    <div style="color:#94a3b8; text-align:center; padding-top:20px;">Yuklanmoqda...</div>
  </div>
  
  <div class="bom-view" id="bom-view">
    <h2 style="margin-top:0; color: #334155;">Modulni tanlang</h2>
    <p style="color:#64748b;">Kerakli xomashyolar ro'yxati (BOM) bu yerda ko'rinadi.</p>
    
    <div id="bom-content" style="display:none;">
        <h3 style="margin-top:20px; border-bottom:2px solid var(--primary); padding-bottom:5px; display:inline-block;">Materiallar</h3>
        <table id="tbl-mat">
            <thead><tr><th>Nomi</th><th>Miqdori</th></tr></thead>
            <tbody></tbody>
        </table>

        <h3 style="margin-top:30px; border-bottom:2px solid var(--primary); padding-bottom:5px; display:inline-block;">Furnituralar</h3>
        <table id="tbl-fur">
            <thead><tr><th>Nomi</th><th>Miqdori</th></tr></thead>
            <tbody></tbody>
        </table>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from './supabaseClient.js';

  async function loadModules() {
    const listEl = document.getElementById('modules-list');
    const { data: modules, error } = await supabase.from('modules').select('*').order('created_at', { ascending: false });
    
    if (error) { listEl.innerHTML = `<div style="color:red">Xatolik: ${error.message}</div>`; return; }
    
    listEl.innerHTML = '';
    modules.forEach(m => {
      const div = document.createElement('div');
      div.className = 'module-item';
      div.innerHTML = `<strong>${m.name || 'Nomsiz'}</strong><span>Artikul: ${m.artikul}</span>`;
      div.onclick = () => loadBom(m);
      listEl.appendChild(div);
    });
  }

  async function loadBom(module) {
    document.querySelector('.bom-view h2').textContent = module.name + ` (${module.artikul})`;
    document.querySelector('.bom-view p').textContent = module.segment ? `Segment: ${module.segment}` : '';
    document.getElementById('bom-content').style.display = 'block';

    const tMat = document.querySelector('#tbl-mat tbody');
    const tFur = document.querySelector('#tbl-fur tbody');
    tMat.innerHTML = '<tr><td colspan="2">Yuklanmoqda...</td></tr>';
    tFur.innerHTML = '<tr><td colspan="2">Yuklanmoqda...</td></tr>';

    try {
        const { data: mats } = await supabase.from('module_materials').select('quantity, materials(name)').eq('module_id', module.id);
        const { data: furs } = await supabase.from('module_fasteners').select('quantity, fasteners(name)').eq('module_id', module.id);

        tMat.innerHTML = mats?.length ? Object.values(mats).map(m => `<tr><td>${m.materials?.name || '?'}</td><td>${m.quantity}</td></tr>`).join('') : '<tr><td colspan="2">Material ulanmagan</td></tr>';
        
        tFur.innerHTML = furs?.length ? Object.values(furs).map(f => `<tr><td>${f.fasteners?.name || '?'}</td><td>${f.quantity}</td></tr>`).join('') : '<tr><td colspan="2">Furnitura ulanmagan</td></tr>';
    } catch (e) {
        console.error(e);
        tMat.innerHTML = `<tr><td colspan="2" style="color:red">Xatolik yuz berdi</td></tr>`;
    }
  }

  loadModules();
</script>

</body>
</html>
