<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Omborchi Tizimi v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app">
    <header class="main-header">
      <div class="logo">
        <span class="icon">📦</span>
        <h1>Omborchi <span>Pro</span></h1>
      </div>
      <div class="user-profile">
        <span id="sync-status" class="status-badge">Bog'langan</span>
      </div>
    </header>

    <main class="dashboard-grid">
      <aside class="sidebar">
        <div class="section-title">
          <h2>Modullar</h2>
          <span class="count" id="module-count">0</span>
        </div>
        <div class="search-box">
          <input type="text" id="search-input" placeholder="Qidiruv...">
        </div>
        <nav id="modules-list" class="scroll-area">
          <div class="loader">Yuklanmoqda...</div>
        </nav>
      </aside>

      <section class="content-view">
        <div id="welcome-screen" class="empty-state">
          <div class="hero-icon">🔎</div>
          <h2>Modulni tanlang</h2>
          <p>Batafsil ma'lumot (BOM) bu yerda ko'rinadi.</p>
        </div>

        <div id="bom-dashboard" class="bom-data" style="display: none;">
          <header class="bom-header">
            <div class="title-group">
              <h2 id="active-module-name">Nomsiz modul</h2>
              <span id="active-module-artikul" class="artikul-tag">-</span>
            </div>
            <div class="segment-pill" id="active-module-segment">Segment</div>
          </header>

          <div class="tables-container">
            <div class="table-card">
              <div class="card-header">
                <h3>🛠️ Materiallar</h3>
              </div>
              <div class="table-wrapper">
                <table id="tbl-materials">
                  <thead>
                    <tr>
                      <th>Nomi</th>
                      <th class="text-right">Miqdori</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>

            <div class="table-card">
              <div class="card-header">
                <h3>⚙️ Furnituralar</h3>
              </div>
              <div class="table-wrapper">
                <table id="tbl-fasteners">
                  <thead>
                    <tr>
                      <th>Nomi</th>
                      <th class="text-right">Miqdori</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
